spring.application.name=capacity-test-project

spring.sql.init.mode=always
spring.datasource.hikari.initialization-fail-timeout=0

spring.datasource.url=jdbc:h2:mem:politique;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.mvc.format.date=dd/MM/yyyy


spring.data.redis.host=localhost
spring.data.redis.port=6379

capacity.jwt.duration=604800000
capacity.jwt.refduration=604800000
capacity.jwt.headername=X-Capacity-Token
capacity.jwt.headerrefname=X-CapacityRef-Token
capacity.jwt.keysecret=C3G1OdVFGZWIDjvE1+1NSbCYOOindXY5TcXda8vI6hI=
# Macaroon Redis active ou non
capacity.macaroon.redis=false
capacity.security.logAudit = true

capacity.dpop.algorithms=ES256,EdDSA
capacity.dpop.active=false

#spring.ai.model.chat=openai
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.options.model=gpt-5-mini

spring.ai.model.chat=openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b
spring.ai.openai.chat.options.max-completion-tokens=500
spring.ai.openai.chat.options.reasoning-effort=none

capacity.agentic.expose-all-tools=false


spring.profiles.active=dev