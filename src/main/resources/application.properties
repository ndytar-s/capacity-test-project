spring.application.name=capacity-test-project

spring.sql.init.mode=always
spring.datasource.hikari.initialization-fail-timeout=0

spring.datasource.url=jdbc:h2:mem:politique;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.mvc.format.date=dd/MM/yyyy


spring.data.redis.host=localhost
spring.data.redis.port=6379

capacity.jwt.duration=604800000
capacity.jwt.refduration=604800000
capacity.jwt.headername=X-Capacity-Token
capacity.jwt.headerrefname=X-CapacityRef-Token
capacity.jwt.keysecret=C3G1OdVFGZWIDjvE1+1NSbCYOOindXY5TcXda8vI6hI=
# Macaroon Redis active ou non
capacity.macaroon.redis=false